<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Same AI, different evidence: five context approaches</title><desc id="desc">Sol is held fixed across all rows. Measured answer quality, total API cost for 96 attempts and median request time vary with the context approach. Briefing rows include full preparation cost. Luna is a separate robustness check in the report.</desc><rect width="1600" height="1000" fill="#101D2D"/><rect x="24" y="24" width="1552" height="952" rx="18" fill="none" stroke="#C88F82" stroke-width="2"/><g font-family="Inter, Helvetica, Arial, sans-serif"><text x="65" y="110" font-size="56" fill="#F4F1E8" font-weight="700" text-anchor="start">Same AI. Different evidence.</text><text x="65" y="165" font-size="26" fill="#B9C4D3" font-weight="400" text-anchor="start">Sol held fixed. The question set stays the same; the information supplied changes.</text><text x="65" y="270" font-size="21" fill="#F0C9B8" font-weight="700" text-anchor="start">CONTEXT APPROACH</text><text x="530" y="270" font-size="21" fill="#F0C9B8" font-weight="700" text-anchor="start">EVIDENCE PACKET</text><text x="820" y="270" font-size="21" fill="#F0C9B8" font-weight="700" text-anchor="start">SUPPORTED / 96</text><text x="1100" y="270" font-size="21" fill="#F0C9B8" font-weight="700" text-anchor="start">API USD / 96</text><text x="1350" y="270" font-size="21" fill="#F0C9B8" font-weight="700" text-anchor="start">MEDIAN</text><rect x="45" y="317" width="1510" height="83" rx="8" fill="#1B2B42"/><text x="65" y="369" font-size="29" fill="#F4F1E8" font-weight="600" text-anchor="start">Whole folder</text><text x="530" y="369" font-size="27" fill="#B9C4D3" font-weight="400" text-anchor="start">124 files</text><text x="820" y="370" font-size="34" fill="#F4F1E8" font-weight="700" text-anchor="start">96/96</text><text x="1100" y="370" font-size="31" fill="#F0C9B8" font-weight="400" text-anchor="start">$3.2598</text><text x="1350" y="370" font-size="29" fill="#F4F1E8" font-weight="400" text-anchor="start">2.32 s</text><rect x="45" y="417" width="1510" height="83" rx="8" fill="#1B2B42"/><text x="65" y="469" font-size="29" fill="#F4F1E8" font-weight="600" text-anchor="start">Keyword search</text><text x="530" y="469" font-size="27" fill="#B9C4D3" font-weight="400" text-anchor="start">5 files</text><text x="820" y="470" font-size="34" fill="#F4F1E8" font-weight="700" text-anchor="start">32/96</text><text x="1100" y="470" font-size="31" fill="#F0C9B8" font-weight="400" text-anchor="start">$0.1901</text><text x="1350" y="470" font-size="29" fill="#F4F1E8" font-weight="400" text-anchor="start">2.40 s</text><rect x="45" y="517" width="1510" height="83" rx="8" fill="#1B2B42"/><text x="65" y="569" font-size="29" fill="#F4F1E8" font-weight="600" text-anchor="start">Linked-record search</text><text x="530" y="569" font-size="27" fill="#B9C4D3" font-weight="400" text-anchor="start">8 selected files</text><text x="820" y="570" font-size="34" fill="#F4F1E8" font-weight="700" text-anchor="start">96/96</text><text x="1100" y="570" font-size="31" fill="#F0C9B8" font-weight="400" text-anchor="start">$0.2200</text><text x="1350" y="570" font-size="29" fill="#F4F1E8" font-weight="400" text-anchor="start">2.24 s</text><rect x="45" y="617" width="1510" height="83" rx="8" fill="#1B2B42"/><text x="65" y="669" font-size="29" fill="#F4F1E8" font-weight="600" text-anchor="start">Reusable brief</text><text x="530" y="669" font-size="27" fill="#B9C4D3" font-weight="400" text-anchor="start">1 reusable brief</text><text x="820" y="670" font-size="34" fill="#F4F1E8" font-weight="700" text-anchor="start">96/96</text><text x="1100" y="670" font-size="31" fill="#F0C9B8" font-weight="400" text-anchor="start">$0.4589</text><text x="1350" y="670" font-size="29" fill="#F4F1E8" font-weight="400" text-anchor="start">2.35 s</text><rect x="45" y="717" width="1510" height="83" rx="8" fill="#1B2B42"/><text x="65" y="769" font-size="29" fill="#F4F1E8" font-weight="600" text-anchor="start">Brief + linked search</text><text x="530" y="769" font-size="27" fill="#B9C4D3" font-weight="400" text-anchor="start">Brief + 8 files</text><text x="820" y="770" font-size="34" fill="#F4F1E8" font-weight="700" text-anchor="start">96/96</text><text x="1100" y="770" font-size="31" fill="#F0C9B8" font-weight="400" text-anchor="start">$0.7764</text><text x="1350" y="770" font-size="29" fill="#F4F1E8" font-weight="400" text-anchor="start">2.18 s</text><text x="65" y="885" font-size="25" fill="#F4F1E8" font-weight="400" text-anchor="start">Correct decision + exact value + required source references.</text><text x="65" y="930" font-size="23" fill="#B9C4D3" font-weight="400" text-anchor="start">48 synthetic cases × 2. Full brief setup counts. API only. Nov 2, 2026.</text></g></svg>